[package]
name = "materialcraft-formats"
description = "MaterialCraft file formats: native SBS packages, bitmap import, texture export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-mime = { workspace = true }
craft-xml = { workspace = true }
craft-mcmat = { workspace = true }
materialcraft-core = { workspace = true }
craft-texture = { workspace = true, features = ["dds"] }
materialcraft-geom = { workspace = true }
materialcraft-nodes = { workspace = true }
craft-mesh = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
roxmltree = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }
craft-svg = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }

[build-dependencies]
flate2 = { workspace = true }
craft-fonts-build = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
dds = { workspace = true }

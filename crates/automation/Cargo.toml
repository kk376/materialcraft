[package]
name = "materialcraft-automation"
description = "MaterialCraft automation: MCP server (rmcp), headless JSON-lines RPC and a bridge to the running app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
materialcraft-engine = { workspace = true }
materialcraft-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
schemars = { workspace = true }
base64 = { workspace = true }
cap-std = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = "3"
rmcp = { workspace = true, features = ["client"] }
